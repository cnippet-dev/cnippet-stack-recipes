# Builds all workspaces (hosts/* and demos/*) via `turbo run build`. Recipes are
# built separately by recipes.yml. Env values below are placeholders for the demos.
name: Build

on:
  workflow_call: {}

env:
  BUN_VERSION: 1.3.14
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_TELEMETRY_DISABLED: 1
  DATABASE_URL: postgresql://user:password@localhost:5432/db
  BETTER_AUTH_SECRET: build-only-placeholder-secret
  BETTER_AUTH_URL: http://localhost:3000
  GITHUB_CLIENT_ID: build-only-placeholder
  GITHUB_CLIENT_SECRET: build-only-placeholder
  GOOGLE_CLIENT_ID: build-only-placeholder
  GOOGLE_CLIENT_SECRET: build-only-placeholder
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
  API_URL: http://localhost:3000

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # One Next.js build cache per host and demo app
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            hosts/*/.next/cache
            demos/*/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('hosts/**/*.ts', 'hosts/**/*.tsx', 'demos/**/*.ts', 'demos/**/*.tsx') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run build
        run: bun run build
