# Builds all workspaces via `turbo run build`. The Next.js cache path below
# targets apps/reference, the sole Next.js app in this monorepo.
name: Build

on:
  workflow_call:

env:
  BUN_VERSION: 1.3.8
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_TELEMETRY_DISABLED: 1
  DATABASE_URL: postgresql://user:password@localhost:5432/db
  AUTH_SECRET: build-only-placeholder-secret
  BETTER_AUTH_SECRET: build-only-placeholder-secret
  BETTER_AUTH_URL: http://localhost:3000
  GITHUB_CLIENT_ID: build-only-placeholder
  GITHUB_CLIENT_SECRET: build-only-placeholder
  GOOGLE_CLIENT_ID: build-only-placeholder
  GOOGLE_CLIENT_SECRET: build-only-placeholder
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
  API_URL: http://localhost:3000
  UPSTASH_REDIS_REST_URL: https://your.upstash.io
  UPSTASH_REDIS_REST_TOKEN: your-token-asdfas0jpiuhewqnaskjdbxzmcoaidhf
  NEXT_PUBLIC_SUPABASE_URL: https://url.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_key
  SUPABASE_SECRET_KEY: sb_secret_key
  SUPABASE_ACCESS_TOKEN: sbp_token

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # apps/reference is the only Next.js app in this monorepo
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/reference/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('apps/reference/**/*.ts', 'apps/reference/**/*.tsx', 'apps/reference/**/*.mts') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run build
        run: bun run build
