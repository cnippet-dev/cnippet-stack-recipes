# Validates every recipes/*/recipe.config.ts and checks every file under
# files/ is claimed by a step, then composes the affected recipes into the
# hosts they declare and runs `next build` + `tsc --noEmit`.
# On a PR, only recipes touched by the diff are composed (see
# scripts/changed-recipes.ts); a push to main composes all of them.
# Env values come from each recipe's declared envVars (placeholders written by
# scripts/compose.ts), not from a shared env block.
name: Recipes

on:
  workflow_call: {}

env:
  BUN_VERSION: 1.3.14
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  validate:
    name: Validate recipes
    runs-on: ubuntu-latest
    outputs:
      recipes: ${{ steps.changed.outputs.recipes }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR base commit must be present to diff against it.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate recipes
        run: bun run validate-recipes

      - name: Check every file is claimed by a step
        run: bun run check-coverage

      - name: Pick recipes to compose
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_SHA" ]; then
            recipes=$(git diff --name-only "$BASE_SHA" HEAD | bun run --silent changed-recipes)
          else
            recipes=$(bun run --silent changed-recipes --all)
          fi
          echo "recipes=$recipes" >> "$GITHUB_OUTPUT"
          echo "Composing: \`$recipes\`" >> "$GITHUB_STEP_SUMMARY"

  compose:
    name: Compose ${{ matrix.recipe }}
    needs: validate
    if: needs.validate.outputs.recipes != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.validate.outputs.recipes) }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compose and build into each declared host
        run: bun run compose ${{ matrix.recipe }} --build
