# GitHub PR Labeler configuration
# Docs: https://github.com/actions/labeler

"recipes":
  - changed-files:
      - any-glob-to-any-file: "recipes/**"

"hosts":
  - changed-files:
      - any-glob-to-any-file: "hosts/**"

"demos":
  - changed-files:
      - any-glob-to-any-file: "demos/**"

"scripts":
  - changed-files:
      - any-glob-to-any-file: "scripts/**"

"package:eslint-config":
  - changed-files:
      - any-glob-to-any-file: "packages/eslint-config/**"

"package:typescript-config":
  - changed-files:
      - any-glob-to-any-file: "packages/typescript-config/**"

"ci/cd":
  - changed-files:
      - any-glob-to-any-file: ".github/**"

"documentation":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "**/*.mdx"

"dependencies":
  - changed-files:
      - any-glob-to-any-file:
          - "**/package.json"
          - "bun.lock"
